<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Page Pet Website</title>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#pictures">Pictures</a>
        <a href="#contact">Contact</a>
        <a href="#video">Video</a>
    </nav>

    <section id="home">
        <h1>Welcome to My Pet Website</h1>
        <p>This website provides information and pictures about pets.</p>
    </section>

    <section id="pictures">
        <h2>Pet Pictures</h2>

        <img
            src="https://images.unsplash.com/photo-1543466835-00a7907e9de1"
            alt="Cute dog"
            width="300"
        >

        <img
            src="https://images.unsplash.com/photo-1574158622682-e40e69881006"
            alt="Cute cat"
            width="300"
        >
    </section>

    <section id="contact">
        <h2>Contact Us</h2>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="message">Message:</label>
            <textarea id="message" name="message"></textarea>

            <br><br>

            <input type="submit" value="Submit">
        </form>
    </section>

    <section id="video">
        <h2>Pet Video</h2>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/1HygThMLzGs"
            title="Pet video"
            allowfullscreen>
        </iframe>
    </section>

    <footer>
        <p>&copy; 2026 One-Page Pet Website</p>
    </footer>

</body>
</html>
